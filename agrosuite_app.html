<html lang="es">

<link rel="manifest" href="manifest.json">

<meta name="mobile-web-app-capable" content="yes">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#f0f2f0;--card:#fff;--border:#dde3dd;--border2:#b8c4b8;
  --text:#1c2b1c;--text2:#4a5e4a;--text3:#8a9e8a;
  --green:#2d6a2d;--green2:#4a9e4a;--green-bg:#e8f5e8;--green-light:#f2faf2;
  --amber:#8a6200;--amber-bg:#fff3cd;
  --red:#c0392b;--red-bg:#fde8e6;
  --blue:#1a5276;--blue-bg:#d6eaf8;
  --frost:#2471a3;--frost-bg:#d6eaf8;
  --purple:#5b2c8e;--purple-bg:#ede7f6;
  --sidebar-w:210px;--r:6px;--r2:10px;
}
body{background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column;font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;}
#app{display:flex;flex:1;overflow:hidden;}
#sidebar{width:var(--sidebar-w);background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0;}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#topbar{height:50px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:10px;flex-shrink:0;}
#content{flex:1;overflow-y:auto;padding:16px 18px;}
.logo{padding:13px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px;}
.logo-icon{width:26px;height:26px;background:var(--green);border-radius:5px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;}
.logo span{font-weight:700;font-size:14px;color:var(--green);}
.nav-section{padding:8px 0 4px;}
.nav-label{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.07em;padding:4px 15px 2px;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:8px;padding:6px 15px;cursor:pointer;font-size:12px;color:var(--text2);border-left:2px solid transparent;transition:all .12s;}
.nav-item:hover{background:var(--green-light);}
.nav-item.active{background:var(--green-bg);color:var(--green);border-left-color:var(--green);font-weight:600;}
.sidebar-footer{margin-top:auto;padding:10px 15px;border-top:1px solid var(--border);}
.user-pill{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:var(--r);}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.page-title{font-size:14px;font-weight:700;flex:1;}
.tbadge{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600;}
.tb-green{background:var(--green-bg);color:var(--green);}
.tb-amber{background:var(--amber-bg);color:var(--amber);}
.tb-red{background:var(--red-bg);color:var(--red);}
.tb-blue{background:var(--blue-bg);color:var(--blue);}
.tbtn{height:28px;padding:0 10px;border:1px solid var(--border2);border-radius:var(--r);background:var(--card);color:var(--text2);font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .12s;white-space:nowrap;}
.tbtn:hover{background:var(--bg);}
.tbtn-primary{background:var(--green);color:#fff;border-color:var(--green);}
.tbtn-primary:hover{opacity:.9;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px;margin-bottom:14px;}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:wrap;}
.card-title{font-size:12px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.metric{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:14px;display:flex;flex-direction:column;gap:3px;}
.metric-label{font-size:10px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.metric-val{font-size:22px;font-weight:700;line-height:1.1;}
.metric-sub{font-size:10px;color:var(--text3);}
.m-green .metric-val{color:var(--green);}
.m-amber .metric-val{color:var(--amber);}
.m-frost .metric-val{color:var(--frost);}
.m-purple .metric-val{color:var(--purple);}
.alert{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;border-radius:var(--r);border:1px solid;margin-bottom:8px;font-size:11px;}
.alert-title{font-weight:700;margin-bottom:2px;font-size:12px;}
.a-red{background:var(--red-bg);border-color:#f0b0a8;color:var(--red);}
.a-amber{background:var(--amber-bg);border-color:#f0d080;color:var(--amber);}
.a-blue{background:var(--blue-bg);border-color:#a0c8e8;color:var(--blue);}
.a-green{background:var(--green-bg);border-color:#a0d0a0;color:var(--green);}
table{width:100%;border-collapse:collapse;font-size:11px;}
th{font-size:10px;font-weight:700;color:var(--text2);text-align:left;padding:5px 8px;border-bottom:1px solid var(--border);text-transform:uppercase;white-space:nowrap;}
td{padding:6px 8px;border-bottom:1px solid var(--border);color:var(--text);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--green-light);}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px;}
.dot-green{background:var(--green2);}
.dot-red{background:var(--red);}
.bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;background:var(--green2);}
.chart-wrap{position:relative;}
.tabs{display:flex;gap:2px;background:var(--bg);border-radius:var(--r);padding:3px;margin-bottom:14px;}
.tab{padding:4px 11px;border-radius:5px;font-size:11px;cursor:pointer;color:var(--text2);font-weight:600;transition:all .12s;}
.tab.active{background:var(--card);color:var(--green);box-shadow:0 1px 3px rgba(0,0,0,.08);}
.loading{display:flex;align-items:center;justify-content:center;height:150px;color:var(--text3);font-size:12px;gap:8px;}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
input,select,textarea{padding:7px 9px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-size:12px;width:100%;}
input:focus,select:focus{outline:none;border-color:var(--green);}
label{font-size:11px;font-weight:600;display:block;margin-bottom:4px;color:var(--text2);}
.btn-primary{background:var(--green);color:#fff;border:none;border-radius:var(--r);padding:9px 16px;font-size:12px;font-weight:600;cursor:pointer;width:100%;}
.sel{height:26px;padding:0 7px;border:1px solid var(--border2);border-radius:var(--r);font-size:11px;background:var(--card);color:var(--text);width:auto;}
.stat-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);}
.stat-row:last-child{border-bottom:none;}
.empty{color:var(--text3);font-size:11px;padding:12px 0;text-align:center;}

/* ================================================================
   MÓVIL — el layout base de arriba es de escritorio (sidebar fija,
   grids de 2/3/4 columnas). Debajo de 860px el sidebar se convierte
   en un cajón (drawer) que se abre con el botón ☰, y las grillas se
   apilan en una sola columna para que las tarjetas y tablas se vean
   bien en una pantalla angosta.
   ================================================================ */
#hamburger{display:none;}
#sidebar-overlay{display:none;}
@media (max-width: 860px) {
  #hamburger{display:flex;align-items:center;justify-content:center;width:32px;height:32px;
    border-radius:var(--r);border:1px solid var(--border2);background:var(--card);
    font-size:16px;cursor:pointer;flex-shrink:0;}
  #app{position:relative;}
  #sidebar{position:fixed;top:0;left:0;bottom:0;z-index:501;width:230px;max-width:80vw;
    transform:translateX(-100%);transition:transform .2s ease;box-shadow:2px 0 16px rgba(0,0,0,.2);}
  #sidebar.open{transform:translateX(0);}
  #sidebar-overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);
    z-index:500;opacity:0;pointer-events:none;transition:opacity .2s ease;}
  #sidebar-overlay.show{opacity:1;pointer-events:auto;}

  #topbar{height:auto;min-height:50px;padding:8px 10px;flex-wrap:wrap;row-gap:6px;}
  .page-title{font-size:13px;flex:1 1 auto;}
  #upd-badge{display:none;}
  #topbar .tbtn{font-size:10px;padding:0 8px;height:30px;}
  #topbar .sel{height:30px;font-size:11px;}

  #content{padding:10px;}
  .card{padding:11px;margin-bottom:10px;}
  .card-header{margin-bottom:9px;}
  .card-title{font-size:11px;}
  .g2,.g3,.g4{grid-template-columns:1fr;gap:10px;}
  .metric{padding:11px;}
  .metric-val{font-size:19px;}

  /* Los inputs/selects a 16px evitan que iOS Safari haga zoom automático
     al enfocarlos — con font-size menor a 16px, Safari agranda toda la
     página al tocar un campo, que es justo lo que se ve "poco amena". */
  input,select,textarea{font-size:16px;}
  .sel{font-size:12px;}

  table{font-size:10.5px;}
  th,td{padding:5px 6px;}
  .tbtn{padding:0 8px;}

  /* El modal (showModal) ocupa casi todo el ancho y queda pegado arriba,
     no centrado, para que el teclado en pantalla no lo tape. */
  .modal-overlay{align-items:flex-start!important;padding-top:14px!important;}
  .modal-box{width:100%!important;max-width:100%!important;margin:0 8px;}
}
@media (max-width: 420px) {
  .metric-val{font-size:17px;}
  .card-title{font-size:10.5px;}
  .g4{grid-template-columns:1fr 1fr;} /* 4 métricas en 2x2 en vez de 1 columna larga */
}
</style>
</head>
<body>
<div id="app">
<div id="sidebar-overlay" onclick="toggleSidebar(false)"></div>
<div id="sidebar">
  <div class="logo">

</div>

<script>
// ================================================================
// CONFIG
// ================================================================
const SB_URL = 'https://kysyovhjlzrsfbptcfli.supabase.co';
const SB_KEY = 'sb_publishable_2WKV1WxA1tdy6f0KJbqFBw_1kZwN6cK';

// ================================================================
// STATE — only real data from DB, nothing invented
// ================================================================
let SESSION = null;
let WEATHER = null;
let CHARTS  = {};
let PAGE    = 'dashboard';
// DB tables cached
let ALL_USERS    = [];
let CHILL_ROWS   = []; // all chill_readings rows
let CAMPOS       = [];
let CUARTELES    = [];
let FRIO_CAMPOS  = [];
let GD_CAMPOS    = [];
let PODA_DATA    = [];
let PROD_DATA    = [];
let FEN_DATA     = [];
let LABORES_DATA = [];
let ALERTAS_ACUM  = []; // frio_alerts: alertas de frío Y de grados-día (campo modelo='gd')
let HIDDEN_CAMPOS_FRIOGD = new Set(); // ids de campos ocultos en la vista Frio & GD
let FORECAST_CACHE = {}; // {stationName: {ts, openmeteo:[...], yr:[...]}}

// Ubicación aproximada por estación física, para pronóstico Open-Meteo / YR.
// MACAYA: coordenadas reales de la estación (entregadas por el usuario).
// El Carmen: usa San Fernando (ciudad más cercana) porque su estación es Agroclima.
// Hacienda Ibacache: usa Ibacache, Melipilla, Región Metropolitana.
const FORECAST_LOCATIONS = {
  'MACAYA':            { lat: -34.63554, lon: -71.10718, label: 'MACAYA (ubicación de la estación)' },
  'El Carmen':         { lat: -34.58121, lon: -70.98953, label: 'San Fernando, Chile' },
  'Hacienda Ibacache': { lat: -33.5,     lon: -71.26667, label: 'Ibacache, Melipilla (RM)' },
};

// ── MODELO DE HELADA CALIBRADO CON EL HISTÓRICO REAL DE CADA ESTACIÓN ──
// Método: "punto de rocío 2 h después de la puesta de sol" (variante del
// método FAO de Snyder & de Melo-Abreu, Frost Protection: fundamentals,
// practice and economics, FAO 2005 — capítulo de predicción de T.mín).
// Se ajustó T.mín_madrugada = b·PuntoRocío(puesta+2h) + a por regresión
// lineal usando SOLO noches "radiativas" (viento nocturno promedio <8 km/h)
// del historial real 2025-2026 (MACAYA) y 2017-2026 (Hacienda Ibacache):
// en ese historial, 0 de las 13 noches con viento ≥8 km/h tuvieron helada,
// lo que confirma que el viento nocturno es el mejor "apaga-heladas" y por
// eso se usa como filtro. El Carmen (Agroclima) aún no tiene suficiente
// historial horario (recién ~50 lecturas) para calibrar un modelo propio.
const FROST_CALIB = {
  'MACAYA': {
    a: -3.954, b: 1.159,
    rmse: 2.16, hitRate0: 0.54, hitRate2: 0.63, farRate2: 0.01,
    nNoches: 225, nHeladas: 28, periodo: '2025-2026',
  },
  'Hacienda Ibacache': {
    a: -5.590, b: 1.103,
    rmse: 2.93, hitRate0: 0.31, hitRate2: 0.50, farRate2: 0.06,
    nNoches: 719, nHeladas: 122, periodo: '2017-2026',
  },
};
const FROST_WIND_GATE_KMH = 8; // viento nocturno prom. ≥ esto → 0 heladas en el histórico real

// ================================================================
// HELPERS
// ================================================================
function yr()   { return parseInt(document.getElementById('season-sel').value); }
function szn()  { const y=yr(); return `${y}/${String(y+1).slice(-2)}`; }
function fmt(v,d=1,u='') { return (v===null||v===undefined) ? '—' : (typeof v==='number'?v.toFixed(d):v)+u; }
function el(id) { return document.getElementById(id); }
function getAllReadings() { return WEATHER?.current_readings||[]; }
function myProfile()     { return SESSION?.profile||{}; }
function myChillLatest() {
  const uid = myProfile().id;
  return CHILL_ROWS.filter(c=>c.usuario_id===uid).sort((a,b)=>new Date(b.recorded_at)-new Date(a.recorded_at))[0]||null;
}
function myChillPrev() {
  const uid = myProfile().id;
  const prevYr = yr()-1;
  return CHILL_ROWS.filter(c=>c.usuario_id===uid&&new Date(c.recorded_at).getFullYear()===prevYr)
    .sort((a,b)=>b.acumulado-a.acumulado)[0]||null;
}

// ---- Periodos de acumulación (frío: 15 may–31 jul · GD: 1 ago–31 dic) ----
function isChillPeriodActive(d=new Date()) {
  const m=d.getMonth()+1, day=d.getDate();
  return (m===5&&day>=15) || m===6 || m===7;
}
function isGDPeriodActive(d=new Date()) {
  const m=d.getMonth()+1;
  return m>=8 && m<=12;
}
// ---- GD por usuario: se reutiliza el campo (y su estación) que comparte
// el mismo davis_station_id / agroclima_codigo configurado por el usuario ----
function campoForEstacion(estacionTipo, davisId, agroCod) {
  return CAMPOS.find(c=>{
    if (estacionTipo==='davis') return c.estacion_tipo==='davis' && davisId && String(c.davis_station_id)===String(davisId);
    return c.estacion_tipo!=='davis' && agroCod && String(c.agroclima_codigo)===String(agroCod);
  }) || null;
}
function gdLatestParaUsuario(u) {
  const campo = campoForEstacion(u.estacion_tipo, u.davis_station_id, u.agroclima_codigo);
  if (!campo) return null;
  const y = yr();
  const rows = GD_CAMPOS.filter(g=>g.campo_id===campo.id && g.year===y).sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));
  if (!rows.length) return null;
  return {...rows[rows.length-1], campo};
}

// ---- Helpers por CAMPO (frío / GD / estación en vivo) ----
function campoTieneEstacionConfigurada(c) {
  if (!c) return false;
  if (c.estacion_tipo==='davis') return !!(c.davis_station_id && c.davis_api_key && c.davis_api_secret);
  return !!c.agroclima_codigo;
}
function frioAcumCampo(campoId, year, modeloField) {
  const rows = FRIO_CAMPOS.filter(f=>f.campo_id===campoId&&f.year===year);
  if (!rows.length) return null;
  return rows.reduce((s,r)=>s+(r[modeloField]||0),0);
}
// Comparativo justo: solo las quincenas cuyo fin cae hasta el mismo día-mes
// de hoy (si ya pasó toda la temporada de frío, corteMD='MM-DD' de hoy será
// mayor a fecha_fin de todas las quincenas de todos modos, así que el
// resultado es igual al total completo — no cambia nada fuera de temporada).
function frioAcumCampoHastaFecha(campoId, year, modeloField, corteMD) {
  const rows = FRIO_CAMPOS.filter(f=>f.campo_id===campoId&&f.year===year&&String(f.fecha_fin).slice(5,10)<=corteMD);
  if (!rows.length) return null;
  return rows.reduce((s,r)=>s+(r[modeloField]||0),0);
}
function gdAcumCampo(campoId, year) {
  const rows = GD_CAMPOS.filter(g=>g.campo_id===campoId&&g.year===year);
  if (!rows.length) return null;
  return rows.slice(-1)[0]?.gd_acum ?? null;
}
// Comparativo justo con la temporada anterior: el acumulado de GD SOLO hasta
// el mismo día-mes de hoy (no el total de toda la temporada anterior), para
// comparar manzanas con manzanas mientras la temporada actual está en curso.
function gdAcumCampoHastaFecha(campoId, year, corteMD) {
  const rows = GD_CAMPOS.filter(g=>g.campo_id===campoId&&g.year===year&&String(g.fecha).slice(5,10)<=corteMD);
  if (!rows.length) return null;
  return rows[rows.length-1]?.gd_acum ?? null;
}

// ---- Alertas de acumulación (frío o grados-día) por campo ----
// frio_alerts.modelo puede ser 'horas' | 'richardson' | 'utah' (frío) o 'gd'
// (grados-día) — mismo registro, mismo umbral, distinto valor a comparar.
const MODELO_FRIO_FIELD = {horas:'horas_frio', richardson:'richardson', utah:'dynamic_model'};
function labelModeloAlerta(modelo) {
  return modelo==='gd' ? 'Grados Día'
    : modelo==='utah' ? 'Porciones de Frío'
    : modelo==='richardson' ? 'Richardson Mod.'
    : 'Horas Frío';
}
function valorAcumuladoParaAlerta(a) {
  const y = yr();
  if (a.modelo==='gd') return gdAcumCampo(a.campo_id, y);
  return frioAcumCampo(a.campo_id, y, MODELO_FRIO_FIELD[a.modelo]||'horas_frio');
}
// Revisa cada alerta activa y no disparada contra el acumulado real de su
// campo; si se cruzó el umbral, la marca como disparada en Supabase y avisa
// al usuario. Se llama después de cada loadAll(), así que una alerta ya
// disparada no vuelve a avisar en la sesión siguiente (queda con 🔔 en la
// página Alertas hasta que el usuario la elimine).
async function checkAlertasAcumulacion() {
  const pendientes = ALERTAS_ACUM.filter(a=>a.activa && !a.disparada);
  if (!pendientes.length) return;
  for (const a of pendientes) {
    const valor = valorAcumuladoParaAlerta(a);
    if (valor===null || valor < a.umbral) continue;
    try {
      await sb('PATCH',`frio_alerts?id=eq.${a.id}`,{disparada:true});
      a.disparada = true;
      const campo = CAMPOS.find(c=>c.id===a.campo_id);
      const msg = a.mensaje ? `\n"${a.mensaje}"` : '';
      alert(`🔔 Alerta de acumulación\n${labelModeloAlerta(a.modelo)} en ${campo?.nombre||'campo'} alcanzó ${fmt(valor,1)} (umbral: ${a.umbral}).${msg}`);
    } catch(e) { console.error('checkAlertasAcumulacion:', e); }
  }
}
function readingForCampo(c, rdgs) {
  return rdgs.find(r =>
    (c.estacion_tipo==='davis' && c.davis_station_id && String(r.station_id)===String(c.davis_station_id)) ||
    (c.estacion_tipo!=='davis' && c.agroclima_codigo && String(r.station_id)===String(c.agroclima_codigo)) ||
    r.station_name===c.nombre
  ) || null;
}

async function sb(method, table, body=null, query='') {
  const h = {'apikey':SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'};
  if (SESSION?.access_token) h['Authorization'] = 'Bearer '+SESSION.access_token;
  const r = await fetch(`${SB_URL}/rest/v1/${table}${query}`, {
    method, headers:h, body: body?JSON.stringify(body):null
  });
  if (r.status===401) { showLogin(); throw new Error('Unauthorized'); }
  const t = await r.text();
  const data = t ? JSON.parse(t) : [];
  if (!r.ok) {
    const msg = data?.message || data?.error_description || data?.error || `Error ${r.status}`;
    alert('⚠️ Error al guardar: '+msg);
    throw new Error(msg);
  }
  return data;
}
async function sbAuth(ep, body) {
  const r = await fetch(`${SB_URL}/auth/v1/${ep}`, {
    method:'POST',
    headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  return r.json();
}

      sb('GET','weather_snapshots?order=created_at.desc&limit=1'),
      sb('GET','chill_readings?order=recorded_at.desc&limit=500'),
      sb('GET','usuarios?active=eq.true&order=nombre'),
      sb('GET','campos_prod?activo=eq.true&order=nombre'),
      sb('GET','cuarteles_prod?activo=eq.true&order=campo_id,nombre'),
      sb('GET',`frio_campo?year=in.(${y},${y-1})&order=campo_id,quincena`),
      sb('GET',`grados_dia_campo?year=in.(${y},${y-1})&order=campo_id,fecha`),
      sb('GET','poda_prod?order=cuartel_id,year'),
      sb('GET','produccion_prod?order=cuartel_id,year'),
      sb('GET','fenologia_prod?order=cuartel_id,year'),
      sb('GET','labores?order=fecha_inicio.asc').catch(()=>[]),
      sb('GET','frio_alerts?activa=eq.true').catch(()=>[]),
    ]);

    if (snap&&snap[0]) WEATHER = snap[0].payload;
    ALL_USERS    = users||[];
    CHILL_ROWS   = chills||[];
    CAMPOS       = campos||[];
    CUARTELES    = cuarteles||[];
    FRIO_CAMPOS  = frio||[];
    GD_CAMPOS    = gd||[];
    PODA_DATA    = poda||[];
    PROD_DATA    = prod||[];
    FEN_DATA     = fen||[];
    LABORES_DATA = labores||[];
    ALERTAS_ACUM = alertasAcum||[];

    // Chill by user (latest per user)
    const rdgs = getAllReadings();
    const ok   = rdgs.filter(r=>r.temp_c!==null).length;
    el('upd-badge').textContent   = WEATHER?.updated_at_human||'Sin datos';
    el('status-badge').textContent = `● ${ok}/${rdgs.length} estaciones`;
    el('status-badge').className   = 'tbadge '+(ok===rdgs.length?'tb-green':ok>0?'tb-amber':'tb-red');

    renderPage();
    checkAlertasAcumulacion();
  } catch(e) {
    console.error('loadAll:', e);
    el('status-badge').textContent = '● Error';
    el('status-badge').className   = 'tbadge tb-red';
  }
}

function swTab(t) {
  el('tab-li').classList.toggle('active',t==='login');

async function doLogin() {
  const email=el('li-e').value, pass=el('li-p').value;
  if(!email||!pass) return;
  const data = await sbAuth('token?grant_type=password',{email,password:pass});
  if (!data.access_token) {
    el('li-err').textContent = data.error_description||'Credenciales incorrectas';
    el('li-err').style.display=''; return;
  }
  SESSION = data;
  localStorage.setItem('sb_session',JSON.stringify(data));
  await loadProfile();
  await loadAll();
}

async function doRegister() {
  const nombre=el('rg-n').value, email=el('rg-e').value, pass=el('rg-p').value;
  const rol=el('rg-r').value, modelo=el('rg-m').value;
  if(!nombre||!email||!pass){ el('rg-err').textContent='Completa todos los campos';el('rg-err').style.display='';return; }
  const auth = await sbAuth('signup',{email,password:pass});
  if (auth.error){ el('rg-err').textContent=auth.error.message;el('rg-err').style.display='';return; }
  const sess = auth.session||auth;
  if (!sess?.access_token) {
    el('rg-err').style.cssText='display:block;color:var(--green);';
    el('rg-err').textContent='✅ Revisa tu email para confirmar, luego inicia sesión.';
    swTab('login'); return;
  }
  SESSION=sess; localStorage.setItem('sb_session',JSON.stringify(sess));
  try { await sb('POST','usuarios',{nombre,email,password_hash:'(supabase-auth)',rol,modelo_frio:modelo}); } catch(e){}
  await loadProfile(); await loadAll();
}

function doLogout() {
  SESSION=null; localStorage.removeItem('sb_session');
  WEATHER=null; ALL_USERS=[];
  showLogin();
}

async function loadProfile() {
  if (!SESSION) return;
  const email = SESSION.user?.email||SESSION.email;
  if (!email) return;
  try {
    const rows = await sb('GET',`usuarios?email=eq.${encodeURIComponent(email)}&limit=1`);
    if (rows&&rows[0]) {
      SESSION.profile = rows[0];
      const u=rows[0];

}

function updateDashFrio() {
  const campoId = parseInt(el('dash-frio-campo')?.value);
  const modelo  = el('dash-frio-model')?.value || 'horas_frio';
  const c = CAMPOS.find(x=>x.id===campoId);
  const y = yr();
  const body = el('dash-frio-body');
  if (!body || !c) return;
  if (!campoTieneEstacionConfigurada(c)) {
    body.innerHTML = `<div style="font-size:10px;color:var(--red);">Sin estación configurada para ${c?.nombre||'este campo'} — revisa Campos → ⚙️ Estación</div>`;
    return;
  }
  const acum = frioAcumCampo(campoId, y, modelo);
  const hoyMD = new Date().toISOString().slice(5,10);
  const acumPrev = frioAcumCampoHastaFecha(campoId, y-1, modelo, hoyMD);
  if (acum===null) {
    body.innerHTML = `<div style="font-size:10px;color:var(--text3);">Sin datos de frío para ${c.nombre} en ${szn()} — falta correr agrosuite_campos_sync.py</div>`;
    return;
  }
  body.innerHTML = `
    <div class="metric-val">${fmt(acum,1)}</div>
    <div class="metric-sub">T. anterior a la misma fecha: ${acumPrev===null?'sin datos':fmt(acumPrev,1)}</div>`;
}

function updateDashGD() {
  const campoId = parseInt(el('dash-gd-campo')?.value);
  const c = CAMPOS.find(x=>x.id===campoId);
  const y = yr();
  const body = el('dash-gd-body');

  if (!campoTieneEstacionConfigurada(c)) {
    body.innerHTML = `<div style="font-size:10px;color:var(--red);">Sin estación configurada para ${c?.nombre||'este campo'} — revisa Campos → ⚙️ Estación</div>`;
    return;
  }
  const gd = gdAcumCampo(campoId, y);
  const hoyMD = new Date().toISOString().slice(5,10);
  const gdPrev = gdAcumCampoHastaFecha(campoId, y-1, hoyMD);
  if (gd===null) {
    body.innerHTML = `<div style="font-size:10px;color:var(--text3);">Sin datos de GD para ${c.nombre} — falta correr agrosuite_campos_sync.py</div>`;
    return;
  }

}

let LLUVIA_CACHE = null; // {ts, porDia} — compartido entre Dashboard y Clima & Alertas
async function computeLluviaPorEstacion() {
  const hoy = new Date();
  const yearStart = `${hoy.getFullYear()}-01-01`;
  let rows = [];
  try {
    // Supabase/PostgREST limita cada respuesta a un máximo de filas por página
    // (independiente del "limit" pedido) — con miles de lecturas en el año,
    // una sola llamada se quedaba solo con enero/inicios de febrero y por eso
    // "mes" y "año" salían mal o vacíos. Se pagina con offset hasta traer todo.
    const PAGE = 1000;
    let offset = 0;
    while (true) {
      const page = await sb('GET', `station_readings?recorded_at=gte.${yearStart}&select=station_name,rain_mm,recorded_at&order=recorded_at.asc&limit=${PAGE}&offset=${offset}`);
      rows = rows.concat(page);
      if (!page.length || page.length < PAGE) break;
      offset += PAGE;
    }
  } catch(e) { return null; }
  // Por estación y día calendario nos quedamos con el máximo rain_mm del día
  // (es un acumulado-del-día que se reinicia a medianoche), y sumamos esos
  // máximos diarios — sumar directamente todas las lecturas horarias
  // sobrecontaría, porque cada una ya es el acumulado del día hasta esa hora.
  const porDia = {};
  rows.forEach(r=>{
    if (r.rain_mm===null || r.rain_mm===undefined) return;
    const fecha = r.recorded_at.slice(0,10);
    porDia[r.station_name] = porDia[r.station_name] || {};
    porDia[r.station_name][fecha] = Math.max(porDia[r.station_name][fecha]||0, r.rain_mm);
  });
  return porDia;
}
async function getLluviaPorEstacionCached() {
  if (LLUVIA_CACHE && (Date.now()-LLUVIA_CACHE.ts)<10*60*1000) return LLUVIA_CACHE.porDia;
  const porDia = await computeLluviaPorEstacion();
  LLUVIA_CACHE = {ts:Date.now(), porDia};
  return porDia;
}
function renderLluviaResumenHTML(porDia) {
  if (!porDia) return `<div style="font-size:10px;color:var(--red);">No se pudo calcular lluvia acumulada</div>`;

  const hoy = new Date();
  const mesActual = hoy.toISOString().slice(0,7);

    const dias = porDia[name];

}

// ================================================================
// PRONÓSTICO 14 DÍAS — Open-Meteo vs YR (met.no)
// Comparación entre ambas fuentes por ubicación geográfica.
// No usa datos de tus estaciones: es pronóstico puro, para heladas futuras.
// ================================================================
async function fetchOpenMeteoForecast(lat, lon) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto&forecast_days=14`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('Open-Meteo '+r.status);
  const j = await r.json();
  const d = j.daily || {};
  return (d.time||[]).map((f,i)=>({
    fecha:  f,
    tmin:   d.temperature_2m_min ? d.temperature_2m_min[i] : null,
    tmax:   d.temperature_2m_max ? d.temperature_2m_max[i] : null,
    lluvia: d.precipitation_sum  ? d.precipitation_sum[i]  : null,
  }));
}

async function fetchYrForecast(lat, lon) {
  const url = `https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${lat}&lon=${lon}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('YR '+r.status);
  const j = await r.json();
  const porDia = {};
  (j.properties?.timeseries||[]).forEach(ts=>{
    const fecha = new Date(ts.time).toLocaleDateString('en-CA',{timeZone:'America/Santiago'});
    if (!porDia[fecha]) porDia[fecha] = {fecha, tmin:null, tmax:null, lluvia:0};
    const t = ts.data?.instant?.details?.air_temperature;
    if (t!=null) {
      porDia[fecha].tmin = porDia[fecha].tmin===null ? t : Math.min(porDia[fecha].tmin, t);
      porDia[fecha].tmax = porDia[fecha].tmax===null ? t : Math.max(porDia[fecha].tmax, t);
    }
    const p6 = ts.data?.next_6_hours?.details?.precipitation_amount;
    if (p6!=null) porDia[fecha].lluvia += p6;
  });
  return Object.values(porDia).sort((a,b)=>a.fecha.localeCompare(b.fecha)).slice(0,14);
}

// Insumos para el modelo calibrado: temperatura y punto de rocío 2 h después
// de la puesta de sol (detectada con la bandera horaria is_day de Open-Meteo,
// el mismo método usado para calibrar contra el histórico real de la
// estación), más el viento promedio de esa hora hasta el amanecer.
// Se agrupa por la fecha del AMANECER (igual convención que Open-Meteo/YR
// diario), para que calce con las filas de la tabla de pronóstico.
async function fetchCalibInputs(lat, lon) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,dew_point_2m,wind_speed_10m,is_day&timezone=auto&forecast_days=16`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('Open-Meteo calib '+r.status);
  const j = await r.json();
  const h = j.hourly || {};
  const times = h.time || [];
  const byHour = {};
  times.forEach((t,i)=>{
    byHour[t.slice(0,13)] = {
      temp: h.temperature_2m?.[i]  ?? null,
      dew:  h.dew_point_2m?.[i]    ?? null,
      wind: h.wind_speed_10m?.[i]  ?? null,
      isDay:h.is_day?.[i]          ?? null,
    };
  });
  const byDayHH = {};
  times.forEach(t=>{ const d=t.slice(0,10), hh=parseInt(t.slice(11,13),10); (byDayHH[d]=byDayHH[d]||[]).push(hh); });
  const keyFor = (dateObj,hh) => `${dateObj.toISOString().slice(0,10)}T${String(hh).padStart(2,'0')}`;
  const out = {};
  for (const d of Object.keys(byDayHH).sort()) {
    let sunsetHH = null;
    for (const hh of byDayHH[d]) {
      if (hh<10 || hh>21) continue;
      const rec = byHour[`${d}T${String(hh).padStart(2,'0')}`];
      if (rec && rec.isDay===1) sunsetHH = hh; // última hora de sol dentro de la ventana 10-21h
    }
    if (sunsetHH===null) continue;
    const dt = new Date(d+'T00:00:00');
    let targetHH = sunsetHH+2, targetDate = new Date(dt);
    if (targetHH>=24) { targetHH-=24; targetDate.setDate(targetDate.getDate()+1); }
    let ref = byHour[keyFor(targetDate,targetHH)], refHH=targetHH, refDate=targetDate;
    if (!ref || ref.temp==null || ref.dew==null) {
      for (const delta of [-1,1,-2,2]) {
        let hh2=targetHH+delta, dd2=new Date(targetDate);
        if (hh2<0)  { hh2+=24; dd2.setDate(dd2.getDate()-1); }
        if (hh2>=24){ hh2-=24; dd2.setDate(dd2.getDate()+1); }
        const cand = byHour[keyFor(dd2,hh2)];
        if (cand && cand.temp!=null && cand.dew!=null) { ref=cand; refHH=hh2; refDate=dd2; break; }
      }
    }
    if (!ref || ref.temp==null || ref.dew==null) continue;

    let windSum=0, windN=0;
    if (ref.wind!=null) { windSum+=ref.wind; windN++; }
    let curHH=refHH, curDate=new Date(refDate);
    for (let step=1; step<=14; step++) {
      curHH++; if (curHH>=24) { curHH=0; curDate.setDate(curDate.getDate()+1); }
      const rr = byHour[keyFor(curDate,curHH)];
      if (rr && rr.wind!=null) { windSum+=rr.wind; windN++; }
    }
    const dawnDate = new Date(dt); dawnDate.setDate(dawnDate.getDate()+1);
    out[dawnDate.toISOString().slice(0,10)] = {
      t2h: ref.temp, td2h: ref.dew, windAvg: windN ? windSum/windN : null,
    };
  }
  return out;
}

// Aplica el modelo calibrado (si existe para la estación) sobre los insumos
// de una noche puntual del pronóstico. Devuelve null si no hay calibración
// o faltan datos — en ese caso se sigue usando el pronóstico crudo.
function fcTminAjustado(stationName, calibNoche) {
  const coef = FROST_CALIB[stationName];
  if (!coef || !calibNoche || calibNoche.td2h==null) return null;
  return Math.round((coef.b*calibNoche.td2h + coef.a)*10)/10;
}

function fcRiesgoHelada(tmin, thr) {
  if (tmin===null || tmin===undefined) return null;
  if (tmin<=thr.frost_severa)   return {label:'Severa',   color:'var(--red)'};
  if (tmin<=thr.frost_moderada) return {label:'Moderada', color:'var(--amber)'};
  if (tmin<=thr.frost_leve)     return {label:'Leve',     color:'var(--frost)'};
  return null;
}

// Alerta temprana por condiciones (no por historial de la estación):
// no hay aún suficiente historial horario en la base (station_readings solo
// tiene días sueltos) para derivar un modelo estadístico propio, así que esto
// usa las condiciones clásicas de helada radiativa (cielo despejado + viento
// calmo en la madrugada) sobre el pronóstico horario de Open-Meteo, que es lo
// que de verdad determina si una noche fría termina en helada o no.
async function fetchNoctData(lat, lon) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=wind_speed_10m,cloud_cover&timezone=auto&forecast_days=14`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('Open-Meteo horario '+r.status);
  const j = await r.json();
  const h = j.hourly || {};
  const porNoche = {};
  (h.time||[]).forEach((t,i)=>{
    const hora = parseInt(t.slice(11,13),10);
    if (!(hora>=21 || hora<=8)) return; // solo ventana de madrugada, donde se forma la helada radiativa
    let fecha = t.slice(0,10);
    if (hora>=21) { const nd=new Date(fecha+'T00:00:00'); nd.setDate(nd.getDate()+1); fecha=nd.toISOString().slice(0,10); }
    if (!porNoche[fecha]) porNoche[fecha] = {viento:[], nubosidad:[]};
    if (h.wind_speed_10m?.[i]!=null) porNoche[fecha].viento.push(h.wind_speed_10m[i]);
    if (h.cloud_cover?.[i]!=null)    porNoche[fecha].nubosidad.push(h.cloud_cover[i]);
  });
  const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
  const out = {};
  Object.entries(porNoche).forEach(([f,v])=>{ out[f] = {viento_prom:avg(v.viento), nubosidad_prom:avg(v.nubosidad)}; });
  return out;
}

function fcCondicionesFavorables(noct) {
  if (!noct) return null;
  const calmo    = noct.viento_prom!=null && noct.viento_prom<8;
  const despejado= noct.nubosidad_prom!=null && noct.nubosidad_prom<30;
  return {calmo, despejado, favorable: calmo && despejado};
}

function fcFechaCorta(f) {
  return new Date(f+'T12:00:00').toLocaleDateString('es-CL',{weekday:'short',day:'2-digit',month:'2-digit'});
}

async function updateClimaForecast() {
  const stationName = el('fc-st-sel')?.value || Object.keys(FORECAST_LOCATIONS)[0];
  const loc = FORECAST_LOCATIONS[stationName];
  const tbody   = el('fc-tbody');
  const banner  = el('fc-frost-banner');
  const locNote = el('fc-loc-note');
  const calibNote = el('fc-calib-note');
  if (!loc) return;
  if (locNote) locNote.textContent = `📍 Ubicación usada: ${loc.label} (${loc.lat.toFixed(4)}, ${loc.lon.toFixed(4)})`;
  if (tbody)  tbody.innerHTML  = `<tr><td colspan="9" class="empty">Cargando pronóstico…</td></tr>`;
  if (banner) banner.innerHTML = '';

  const coef = FROST_CALIB[stationName];
  if (calibNote) calibNote.innerHTML = coef
    ? `🧪 Modelo calibrado con el histórico real de ${stationName}: ${coef.nNoches} madrugadas (${coef.periodo}), incluyendo ${coef.nHeladas} heladas reales. Precisión ±${coef.rmse}°C · detecta ${Math.round(coef.hitRate2*100)}% de las heladas reales (umbral 2°C) con muy pocas falsas alarmas.`
    : `ℹ️ ${stationName} aún no tiene suficiente historial horario propio para calibrar un modelo — se usa el pronóstico geográfico y las condiciones clásicas de helada radiativa (cielo despejado + viento calmo).`;

  const cached = FORECAST_CACHE[stationName];
  const fresh  = cached && (Date.now()-cached.ts) < 30*60*1000;
  let om, yrData, noct, calib;
  if (fresh) {
    om = cached.openmeteo; yrData = cached.yr; noct = cached.noct; calib = cached.calib;
  } else {
    const [omR, yrR, noctR, calibR] = await Promise.allSettled([
      fetchOpenMeteoForecast(loc.lat, loc.lon),
      fetchYrForecast(loc.lat, loc.lon),
      fetchNoctData(loc.lat, loc.lon),
      fetchCalibInputs(loc.lat, loc.lon),
    ]);
    om     = omR.status==='fulfilled'    ? omR.value    : null;
    yrData = yrR.status==='fulfilled'    ? yrR.value    : null;
    noct   = noctR.status==='fulfilled'  ? noctR.value  : null;
    calib  = calibR.status==='fulfilled' ? calibR.value : null;
    FORECAST_CACHE[stationName] = {ts:Date.now(), openmeteo:om, yr:yrData, noct, calib};
  }

  if (!om && !yrData) {
    if (tbody) tbody.innerHTML = `<tr><td colspan="9" class="empty">No se pudo obtener el pronóstico (sin conexión a Open-Meteo ni YR ahora mismo)</td></tr>`;
    return;
  }

  const thr = (myProfile().thresholds)||{frost_leve:-2,frost_moderada:-4,frost_severa:-6,rain_alert_mm:15};
  const fechas    = Array.from(new Set([...(om||[]).map(d=>d.fecha), ...(yrData||[]).map(d=>d.fecha)])).sort();
  const omByFecha = Object.fromEntries((om||[]).map(d=>[d.fecha,d]));
  const yrByFecha = Object.fromEntries((yrData||[]).map(d=>[d.fecha,d]));
  const ajustadoByFecha = {};
  const heladas   = [];
  const lluviasAlerta = [];

  if (tbody) {
    tbody.innerHTML = fechas.map(f=>{
      const o = omByFecha[f]||{}, y = yrByFecha[f]||{};
      const lluviaMax = Math.max(o.lluvia||0, y.lluvia||0);
      if (lluviaMax > thr.rain_alert_mm) lluviasAlerta.push({fecha:f, lluvia:lluviaMax});
      const candidatos = [o.tmin,y.tmin].filter(v=>v!=null);
      const tminGeo = candidatos.length ? Math.min(...candidatos) : null;
      const calibNoche = calib?.[f];
      const tminAjustado = fcTminAjustado(stationName, calibNoche);
      ajustadoByFecha[f] = tminAjustado;
      const protegidoViento = calibNoche?.windAvg!=null && calibNoche.windAvg>=FROST_WIND_GATE_KMH;
      // el riesgo principal usa el T.mín ajustado a la estación cuando existe; si no, el geográfico
      const tminParaRiesgo = tminAjustado!=null ? tminAjustado : tminGeo;
      const riesgo  = fcRiesgoHelada(tminParaRiesgo, thr);
      const cond    = fcCondicionesFavorables(noct?.[f]);
      if (riesgo) heladas.push({fecha:f, tmin:tminParaRiesgo, cond, protegidoViento, ajustado:tminAjustado!=null, ...riesgo});
      let riesgoHtml = '—';
      if (riesgo) {
        riesgoHtml = `<span style="color:${riesgo.color};font-weight:700;">❄️ ${riesgo.label}</span>`;
        if (protegidoViento) {
          riesgoHtml += `<div style="font-size:9px;color:var(--green);">🌬️ viento protector (${fmt(calibNoche.windAvg,0,' km/h')})</div>`;
        } else if (cond) {
          riesgoHtml += cond.favorable
            ? `<div style="font-size:9px;color:var(--red);">cielo despejado + viento calmo</div>`
            : `<div style="font-size:9px;color:var(--text3);">${!cond.despejado?'con nubosidad':''}${!cond.despejado&&!cond.calmo?' / ':''}${!cond.calmo?'con viento':''} (menor confianza)</div>`;
        }
      } else if (protegidoViento) {
        riesgoHtml = `<span style="font-size:9px;color:var(--green);">🌬️ viento protector</span>`;
      }
      const lluviaAlta = 'font-weight:700;color:var(--blue);';
      return `<tr style="${riesgo?'background:'+riesgo.color+'14;':''}">
        <td style="font-weight:600;">${fcFechaCorta(f)}</td>
        <td>${fmt(o.tmin,1,'°C')}</td><td>${fmt(o.tmax,1,'°C')}</td><td style="${(o.lluvia||0)>thr.rain_alert_mm?lluviaAlta:''}">${fmt(o.lluvia,1,'mm')}${(o.lluvia||0)>thr.rain_alert_mm?' 🌧️':''}</td>
        <td>${fmt(y.tmin,1,'°C')}</td><td>${fmt(y.tmax,1,'°C')}</td><td style="${(y.lluvia||0)>thr.rain_alert_mm?lluviaAlta:''}">${fmt(y.lluvia,1,'mm')}${(y.lluvia||0)>thr.rain_alert_mm?' 🌧️':''}</td>
        <td style="font-weight:700;${tminAjustado!=null&&tminAjustado<=thr.frost_leve?'color:var(--frost);':''}">${tminAjustado!=null?fmt(tminAjustado,1,'°C'):'—'}</td>
        <td>${riesgoHtml}</td>
      </tr>`;
    }).join('') || `<tr><td colspan="9" class="empty">Sin datos</td></tr>`;
  }

  if (banner) {
    const heladasReales = heladas.filter(h=>!h.protegidoViento);
    const protegidas    = heladas.filter(h=>h.protegidoViento);
    const altaConfianza = heladasReales.filter(h=>h.ajustado || h.cond?.favorable);
    banner.innerHTML = heladasReales.length ? `
      <div class="alert a-red">
        <span style="font-size:16px;">🧊</span>
        <div><div class="alert-title">Heladas previstas — próximos 14 días</div>
          <div style="color:var(--text);">${heladasReales.map(h=>`${fcFechaCorta(h.fecha)}: ${h.label} (${fmt(h.tmin,1)}°C)${h.ajustado?' 🧪':(h.cond?.favorable?' ⚠️':'')}`).join(' · ')}</div>
          <div style="margin-top:4px;font-size:10px;color:var(--text3);">${altaConfianza.length?'🧪 = T.mín ajustada con tu propio histórico · ':''}${!coef?'⚠️ = cielo despejado y viento calmo (sin modelo calibrado aún)':''}</div>
          ${protegidas.length?`<div style="margin-top:2px;font-size:10px;color:var(--green);">🌬️ ${protegidas.length} noche(s) más salen frías en el pronóstico pero con viento nocturno ≥${FROST_WIND_GATE_KMH} km/h — en el histórico real de esta estación, ninguna noche así tuvo helada.</div>`:''}
        </div>
      </div>` : `
      <div class="alert a-green">
        <span style="font-size:16px;">✅</span>
        <div><div class="alert-title">Sin riesgo de helada previsto</div>
          <div style="color:var(--text);">Próximos 14 días para ${loc.label}${coef?' (modelo ajustado a tu estación)':''}.</div></div>
      </div>`;
    if (lluviasAlerta.length) {
      banner.innerHTML += `
      <div class="alert a-amber" style="margin-top:8px;">
        <span style="font-size:16px;">🌧️</span>
        <div><div class="alert-title">Lluvia sobre tu umbral (${thr.rain_alert_mm}mm)</div>
          <div style="color:var(--text);">${lluviasAlerta.map(l=>`${fcFechaCorta(l.fecha)}: ${fmt(l.lluvia,1)}mm`).join(' · ')}</div>
        </div>
      </div>`;
    }
  }

  buildForecastChart(fechas, omByFecha, yrByFecha, ajustadoByFecha);
}

function buildForecastChart(fechas, omByFecha, yrByFecha, ajustadoByFecha) {
  const ctx = el('fcChart');
  if (!ctx) return;
  if (CHARTS.fc) CHARTS.fc.destroy();
  const labels = fechas.map(fcFechaCorta);
  const datasets = [
    {label:'T.mín Open-Meteo', data:fechas.map(f=>omByFecha[f]?.tmin??null), borderColor:'#2471a3', backgroundColor:'#2471a320', fill:false, tension:.3, borderWidth:2, pointRadius:3},
    {label:'T.mín YR',         data:fechas.map(f=>yrByFecha[f]?.tmin??null), borderColor:'#c0392b', backgroundColor:'#c0392b20', fill:false, tension:.3, borderWidth:2, pointRadius:3, borderDash:[5,3]},
    {label:'T.máx Open-Meteo', data:fechas.map(f=>omByFecha[f]?.tmax??null), borderColor:'#8a6200', backgroundColor:'transparent', fill:false, tension:.3, borderWidth:1.5, pointRadius:2},
    {label:'T.máx YR',         data:fechas.map(f=>yrByFecha[f]?.tmax??null), borderColor:'#7c3aed', backgroundColor:'transparent', fill:false, tension:.3, borderWidth:1.5, pointRadius:2, borderDash:[5,3]},
  ];
  if (ajustadoByFecha && fechas.some(f=>ajustadoByFecha[f]!=null)) {
    datasets.push({label:'T.mín ajustado (tu estación)', data:fechas.map(f=>ajustadoByFecha[f]??null), borderColor:'#00838f', backgroundColor:'#00838f30', fill:false, tension:.3, borderWidth:3, pointRadius:4, pointStyle:'rectRot'});
  }
  CHARTS.fc = new Chart(ctx,{type:'line',data:{labels,datasets},
  options:{responsive:true,maintainAspectRatio:false,
    plugins:{legend:{labels:{font:{size:9},boxWidth:10}}},
    scales:{y:{grid:{color:'rgba(0,0,0,.05)'},ticks:{font:{size:10}}},
      x:{grid:{color:'rgba(0,100,200,.12)',lineWidth:1.5},ticks:{font:{size:9}}}}}});
}

function toggleCampoFrioGD(campoId) {
  if (HIDDEN_CAMPOS_FRIOGD.has(campoId)) HIDDEN_CAMPOS_FRIOGD.delete(campoId);
  else HIDDEN_CAMPOS_FRIOGD.add(campoId);
  updateFrioTable();
  updateGDView();
}

function updateFrioTable() {
  const QORD   = ['Q1_mayo','Q1_junio','Q2_junio','Q1_julio','Q2_julio'];
  const modelo = el('frio-modelo')?.value || 'horas_frio';
  const tbody  = el('frio-tbody');
  if (!tbody) return;
  const y = yr();
  const visibles = CAMPOS.filter(c=>!HIDDEN_CAMPOS_FRIOGD.has(c.id));

  tbody.innerHTML = visibles.map(c=>{
    const cf = FRIO_CAMPOS.filter(f=>f.campo_id===c.id&&f.year===y);
    let acum = 0;
    const vals = QORD.map(q=>{
      const qd=cf.find(f=>f.quincena===q);
      const v=(qd?qd[modelo]:null)||null;
      if(v!==null) acum+=v;
      return v;
    });
    const hoyMD = new Date().toISOString().slice(5,10);
    const acumPrev = frioAcumCampoHastaFecha(c.id, y-1, modelo, hoyMD);
    const delta = acumPrev!==null && acum>0 ? acum-acumPrev : null;
    return `<tr>
      <td style="font-weight:600;">${c.nombre}</td>
      <td style="font-size:10px;color:var(--text3);">${c.estacion_tipo==='davis'?'Davis':'Agroclima'}</td>
      ${vals.map(v=>`<td style="color:var(--frost);font-weight:${v?'700':'400'};">${v!==null?v.toFixed(1):'—'}</td>`).join('')}
      <td style="color:var(--green);font-weight:700;">${acum>0?acum.toFixed(1):'—'}</td>
      <td style="color:var(--text2);">${acumPrev!==null?acumPrev.toFixed(1):'sin datos'}</td>
      <td style="font-weight:700;color:${delta===null?'var(--text3)':delta>=0?'var(--green)':'var(--red)'};">${delta===null?'—':(delta>=0?'+':'')+delta.toFixed(1)}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="10" class="empty">Sin campos visibles</td></tr>';

  buildFrioChart(modelo, visibles);
}

function buildFrioChart(modelo, visibles) {
  const ctx = el('frioChart');
  if (!ctx) return;
  if (CHARTS.frio) CHARTS.frio.destroy();
  const y = yr();
  const QORD = ['Q1_mayo','Q1_junio','Q2_junio','Q1_julio','Q2_julio'];
  const QLAB = ['1ª May','1ª Jun','2ª Jun','1ª Jul','2ª Jul'];
  const colors = ['#2471a3','#2d6a2d','#c0392b','#8a6200','#7c3aed','#0891b2'];

  const datasets = [];
  visibles.forEach((c,i)=>{
    const col = colors[i%colors.length];
    const cfCurr = FRIO_CAMPOS.filter(f=>f.campo_id===c.id&&f.year===y);
    let acum=0;
    const curr = QORD.map(q=>{
      const qd=cfCurr.find(f=>f.quincena===q);
      acum+=(qd?qd[modelo]:0)||0;
      return qd&&qd[modelo]?Math.round(acum*10)/10:null;
    });
    if (curr.some(v=>v!==null)) {
      datasets.push({label:c.nombre,data:curr,borderColor:col,backgroundColor:col+'20',
        fill:false,tension:.4,borderWidth:2,pointRadius:4,spanGaps:false});
    }
    const cfPrev = FRIO_CAMPOS.filter(f=>f.campo_id===c.id&&f.year===y-1);
    let acumP=0;
    const prev = QORD.map(q=>{
      const qd=cfPrev.find(f=>f.quincena===q);
      acumP+=(qd?qd[modelo]:0)||0;
      return qd&&qd[modelo]?Math.round(acumP*10)/10:null;
    });
    if (prev.some(v=>v!==null)) {
      datasets.push({label:`${c.nombre} (T.${y-1})`,data:prev,borderColor:col,backgroundColor:'transparent',
        borderDash:[5,4],fill:false,tension:.4,borderWidth:1.5,pointRadius:2,opacity:.6,spanGaps:false});
    }
  });

  if (!datasets.length) return;
  CHARTS.frio = new Chart(ctx,{type:'line',data:{labels:QLAB,datasets},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{font:{size:9},boxWidth:10}}},
      scales:{y:{min:0,grid:{color:'rgba(0,0,0,.05)'},ticks:{font:{size:10}}},
        x:{grid:{color:'rgba(0,100,200,.12)',lineWidth:1.5},ticks:{font:{size:10}}}}}});
}

function updateGDView() {
  const tbody = el('gd-tbody');
  if (!tbody) return;
  const y = yr();
  const visibles = CAMPOS.filter(c=>!HIDDEN_CAMPOS_FRIOGD.has(c.id));

  const hoyMD = new Date().toISOString().slice(5,10);
  tbody.innerHTML = visibles.map(c=>{
    const gd = gdAcumCampo(c.id, y);
    const gdPrev = gdAcumCampoHastaFecha(c.id, y-1, hoyMD);
    const delta = gd!==null && gdPrev!==null ? gd-gdPrev : null;
    return `<tr>
      <td style="font-weight:600;">${c.nombre}</td>
      <td style="font-size:10px;color:var(--text3);">${c.estacion_tipo==='davis'?'Davis':'Agroclima'}</td>
      <td style="color:var(--purple);font-weight:700;">${gd!==null?fmt(gd,1):'sin datos'}</td>
      <td style="color:var(--text2);">${gdPrev!==null?fmt(gdPrev,1):'sin datos'}</td>
      <td style="font-weight:700;color:${delta===null?'var(--text3)':delta>=0?'var(--green)':'var(--red)'};">${delta===null?'—':(delta>=0?'+':'')+delta.toFixed(1)}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="5" class="empty">Sin campos visibles</td></tr>';

  buildGDChart(visibles);
}

function buildGDChart(visibles) {
  const ctx = el('gdChart');
  if (!ctx) return;
  if (CHARTS.gd) CHARTS.gd.destroy();
  const y = yr();
  const colors = ['#7c3aed','#2471a3','#2d6a2d','#c0392b','#8a6200','#0891b2'];

  // Eje X común: todas las fechas con datos de GD para los campos visibles
  const fechasSet = new Set();
  visibles.forEach(c=>GD_CAMPOS.filter(g=>g.campo_id===c.id&&g.year===y).forEach(g=>fechasSet.add(g.fecha)));
  const fechas = [...fechasSet].sort();

  if (!fechas.length) { if(CHARTS.gd){CHARTS.gd.destroy();CHARTS.gd=null;} return; }

  const datasets = visibles.map((c,i)=>{
    const porFecha = {};
    GD_CAMPOS.filter(g=>g.campo_id===c.id&&g.year===y).forEach(g=>{ porFecha[g.fecha]=g.gd_acum; });
    return {label:c.nombre,data:fechas.map(f=>porFecha[f]??null),
      borderColor:colors[i%colors.length],backgroundColor:colors[i%colors.length]+'20',
      fill:false,tension:.3,borderWidth:2,pointRadius:1,spanGaps:true};
  }).filter(d=>d.data.some(v=>v!==null));

  if (!datasets.length) return;
  CHARTS.gd = new Chart(ctx,{type:'line',data:{labels:fechas.map(f=>f.slice(5)),datasets},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{font:{size:9},boxWidth:10}}},
      scales:{y:{min:0,grid:{color:'rgba(0,0,0,.05)'},ticks:{font:{size:10}}},
        x:{grid:{display:false},ticks:{font:{size:9},maxRotation:60,autoSkip:true,maxTicksLimit:16}}}}});
}

function switchFrioTab(t) {
  el('tab-frio').classList.toggle('active',t==='frio');
  el('tab-gd').classList.toggle('active',t==='gd');
  el('panel-frio').style.display = t==='frio'?'':'none';
  el('panel-gd').style.display   = t==='gd'?'':'none';
}

function produccion() {
  const y = yr();
  const years = [y,y-1,y-2].filter(x=>x>=2023);
  el('content').innerHTML = `
  <div class="card" style="margin-bottom:14px;">
    <div class="card-header">
      <div class="card-title">📦 Producción &amp; Comparativo · ${szn()}</div>
      <button class="tbtn tbtn-primary" onclick="addProd()">+ Ingresar kg/ha</button>
    </div>
    ${CAMPOS.map(c=>{
      const cq=CUARTELES.filter(q=>q.campo_id===c.id);
      const frioTot=FRIO_CAMPOS.filter(f=>f.campo_id===c.id).reduce((s,f)=>s+(f.horas_frio||0),0);
      const gdLast=GD_CAMPOS.filter(g=>g.campo_id===c.id).slice(-1)[0];
      return `<div style="margin-bottom:16px;">
        <div style="font-size:11px;font-weight:700;color:var(--text2);padding:5px 0;border-bottom:1px solid var(--border);margin-bottom:6px;display:flex;gap:12px;">
          <span>🗺️ ${c.nombre}</span>
          <span>❄️ HF ${y}: ${frioTot>0?frioTot.toFixed(0):'—'}</span>
          <span>🌡️ GD: ${gdLast?fmt(gdLast.gd_acum,0):'—'}</span>
        </div>
        <div style="overflow-x:auto;">
        <table>
          <thead><tr>
            <th>Cuartel</th><th>Variedad</th><th>Há</th><th>Pl/ha</th>
            <th>Dardos/pl ${y}</th><th>Frutos/dardo ${y}</th>
            <th>Frutos/dardo ${y-1}<br><span style="font-size:9px;font-weight:400;">calculado desde kg/ha real</span></th>
            ${years.map(yx=>`<th>Kg/ha ${yx}/${String(yx+1).slice(-2)}</th>`).join('')}
            <th>Δ kg/ha</th>
            <th>Notas</th>
          </tr></thead>
          <tbody>${cq.map(q=>{
            const pd=PODA_DATA.find(p=>p.cuartel_id===q.id&&p.year===y);
            const pdPrev=PODA_DATA.find(p=>p.cuartel_id===q.id&&p.year===y-1);
            const prCurr=PROD_DATA.find(p=>p.cuartel_id===q.id&&p.year===y);
            const prPrev=PROD_DATA.find(p=>p.cuartel_id===q.id&&p.year===y-1);
            const prods=years.map(yx=>PROD_DATA.find(p=>p.cuartel_id===q.id&&p.year===yx));
            const nPl=q.n_plantas||1250;
            const plHa=(nPl/q.has);
            // Frutos/dardo temporada anterior = kg/ha real ÷ (pl/ha × dardos × 0.011)
            // — se despeja la fórmula de estimación al revés, usando el dato
            // real de cosecha para saber cuántos frutos/dardo hubo de verdad.
            const fdPrev=prPrev?.kg_ha&&pdPrev?.conteo_dardos&&q.has
              ?(prPrev.kg_ha/(plHa*pdPrev.conteo_dardos*0.011)).toFixed(2)
              :null;
            const delta=prCurr?.kg_ha&&prPrev?.kg_ha?prCurr.kg_ha-prPrev.kg_ha:null;
            // Estimado temporada actual = dardos/pl × pl/ha × 0.011 × frutos/dardo
            // — solo se usa como respaldo mientras no hay kg/ha real ingresado.
            const est=pd?.conteo_dardos&&pd?.flores_dardo
              ?Math.round(pd.conteo_dardos*plHa*0.011*pd.flores_dardo)
              :null;
            return `<tr>
              <td style="font-weight:600;border-left:3px solid var(--green);">${q.nombre}</td>
              <td style="font-size:10px;">${q.variedad||'—'}</td>
              <td>${q.has||'—'}</td>
              <td style="font-size:10px;">${nPl}</td>
              <td style="color:var(--frost);font-weight:700;">${pd?fmt(pd.conteo_dardos,1):'—'}</td>
              <td style="color:var(--green);font-weight:700;">${pd?fmt(pd.flores_dardo,1):'—'}</td>
              <td style="color:var(--amber);">${fdPrev||'—'}</td>
              ${prods.map((p,i)=>{
                const yx=years[i];
                if (p) {
                  return `<td style="color:${yx===y?'var(--green)':'var(--text)'};font-weight:${yx===y?'700':'400'};cursor:pointer;" onclick="editProd(${q.id},${yx})" title="Click para editar">
                    ${fmt(p.kg_ha,0)} ✏️<div style="font-size:9px;color:var(--text3);">real ingresado</div></td>`;
                }
                if (yx===y && est) {
                  return `<td style="color:var(--amber);font-style:italic;cursor:pointer;" onclick="editProd(${q.id},${yx})" title="Click para ingresar el dato real">
                    ${est.toLocaleString()}<div style="font-size:9px;color:var(--text3);">estimado — click para ingresar real</div></td>`;
                }
                return `<td style="color:var(--text3);cursor:pointer;" onclick="editProd(${q.id},${yx})" title="Click para ingresar dato">— ✏️</td>`;
              }).join('')}
              <td style="font-weight:700;color:${delta===null?'var(--text3)':delta>=0?'var(--green)':'var(--red)'};">
                ${delta===null?'—':(delta>=0?'+':'')+Math.round(delta)}</td>
              <td style="font-size:10px;color:var(--text3);max-width:120px;">${prods[0]?.notas||'—'}</td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>
      </div>`;
    }).join('')||'<div class="empty">Sin campos configurados</div>'}
  </div>
  <div class="card">
    <div class="card-header"><div class="card-title">📈 Producción por cuartel — comparativo temporadas</div></div>
    <div style="height:200px;"><canvas id="compChart"></canvas></div>
  </div>`;

  setTimeout(()=>{
    const ctx=el('compChart'); if(!ctx) return;
    const labels=CUARTELES.map(c=>c.nombre.length>12?c.nombre.slice(0,11)+'…':c.nombre);
    const cols=['#2d6a2d','#86c986','#c0392b'];
    CHARTS.comp=new Chart(ctx,{type:'bar',data:{labels,datasets:years.map((yx,i)=>({
      label:`${yx}/${String(yx+1).slice(-2)}`,
      data:CUARTELES.map(q=>{const p=PROD_DATA.find(p=>p.cuartel_id===q.id&&p.year===yx);return p?p.kg_ha:null;}),
      backgroundColor:cols[i],borderRadius:3}))},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{labels:{font:{size:10},boxWidth:10}}},
        scales:{y:{grid:{color:'rgba(0,0,0,.05)'},ticks:{font:{size:10}}},
          x:{grid:{display:false},ticks:{font:{size:10},maxRotation:45}}}}}); }, 100);
}

async function fenologia() {
  el('content').innerHTML='<div class="loading"><div class="spinner"></div>Cargando...</div>';
  const y=yr();
  const [fenCurr,fenPrev]=await Promise.all([
    sb('GET',`fenologia_prod?year=eq.${y}`),
    sb('GET',`fenologia_prod?year=eq.${y-1}`),
  ]);
  const ESTADOS=[
    ['f_yema_hinchada','Yema hinchada'],['f_puntas_verdes','Puntas verdes'],
    ['f_boton_blanco','Botón blanco'],['f_plena_flor','Plena flor'],
    ['f_cuaja','Cuaja'],['f_cosecha_inicio','Inicio cosecha'],['f_cosecha_fin','Fin cosecha'],
  ];
  function diff(d1,d2){if(!d1||!d2)return null;return Math.round((new Date(d1)-new Date(d2))/86400000);}

  el('content').innerHTML=`
  ${CAMPOS.map(c=>{
    const cq=CUARTELES.filter(q=>q.campo_id===c.id);
    return `<div class="card" style="margin-bottom:14px;">
      <div class="card-header">
        <div class="card-title">🌸 ${c.nombre} · ${szn()}</div>
        <button class="tbtn tbtn-primary" onclick="addFenologia(${c.id})">+ Registrar</button>
      </div>
      <div style="overflow-x:auto;"><table style="min-width:700px;">
        <thead><tr><th>Cuartel</th><th>Variedad</th>
          ${ESTADOS.map(([k,l])=>`<th style="font-size:9px;">${l}<br><span style="color:var(--text3);">Δ vs ${y-1}</span></th>`).join('')}
          <th>Notas</th></tr></thead>
        <tbody>${cq.map(q=>{
          const fen=fenCurr.find(f=>f.cuartel_id===q.id);
          const fenP=fenPrev.find(f=>f.cuartel_id===q.id);
          return `<tr>
            <td style="font-weight:600;">${q.nombre}</td>
            <td style="font-size:10px;">${q.variedad||'—'}</td>
            ${ESTADOS.map(([k])=>{
              const v=fen?fen[k]:null;
              const vp=fenP?fenP[k]:null;
              const d=diff(v,vp);
              return `<td style="font-size:10px;">
                <div style="color:${v?'var(--green)':'var(--text3)'};">${v?v.slice(5):'—'}</div>
                ${d!==null?`<div style="font-size:9px;color:${d>0?'var(--red)':d<0?'var(--blue)':'var(--text3)'};">${d>0?'+':''}${d}d</div>`:''}
              </td>`;
            }).join('')}
            <td style="font-size:10px;color:var(--text3);">${fen?.notas||'—'}</td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>
    </div>`;
  }).join('')}`;
}

function buildGantt(data) {
  const withDates = data.filter(l=>l.fecha_inicio);
  if (!withDates.length) return '<div class="empty">Sin fechas en las labores</div>';
  const allStarts=withDates.map(l=>new Date(l.fecha_inicio));
  const allEnds=withDates.map(l=>l.fecha_fin?new Date(l.fecha_fin):new Date(new Date(l.fecha_inicio).getTime()+7*86400000));
  const minD=new Date(Math.min(...allStarts));
  const maxD=new Date(Math.max(...allEnds));
  const totalDays=Math.ceil((maxD-minD)/86400000)+7;
  // labelW más ancho + etiqueta en 2 líneas (labor / campo · huerto) para que
  // se vea qué labor es y de qué huerto, no solo la fecha y el campo.
  const px=16,barH=30,labelW=230;
  const W=Math.max(700,totalDays*px+labelW+20);
  const H=withDates.length*(barH+6)+40;
  const cols=['#2d6a2d','#2471a3','#8a6200','#c0392b','#7c3aed','#0891b2'];
  const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  const bars=withDates.map((l,i)=>{
    const s=Math.ceil((new Date(l.fecha_inicio)-minD)/86400000);
    const endD=l.fecha_fin?new Date(l.fecha_fin):new Date(new Date(l.fecha_inicio).getTime()+7*86400000);
    const dur=Math.max(1,Math.ceil((endD-new Date(l.fecha_inicio))/86400000));
    const x=labelW+s*px; const w=Math.max(3,dur*px);
    const y2=i*(barH+6)+20;
    const col=l.terminada?'#2d6a2d':cols[i%cols.length];
    const campo=CAMPOS.find(c=>c.id===l.campo_id);
    const cuartel=CUARTELES.find(c=>c.id===l.cuartel_id);
    const huerto=cuartel?cuartel.nombre:(campo?'Campo general':'—');
    const labor=l.nombre||'(Sin nombre)';
    const linea2=`${campo?campo.nombre:'?'} · ${huerto}`;
    const rango=`${l.fecha_inicio}${l.fecha_fin?' → '+l.fecha_fin:' — en curso'}`;
    return `<g>
      <title>${esc(labor)} — ${esc(linea2)} (${esc(rango)})</title>
      <text x="${labelW-6}" y="${y2+12}" text-anchor="end" font-size="9.5" font-weight="700" fill="#2d3d2d">${esc(labor.length>28?labor.slice(0,27)+'…':labor)}</text>
      <text x="${labelW-6}" y="${y2+24}" text-anchor="end" font-size="8.5" fill="#6b7d6b">${esc(linea2.length>34?linea2.slice(0,33)+'…':linea2)}</text>
      <rect x="${x}" y="${y2}" width="${w}" height="${barH}" fill="${col}" opacity="${l.terminada?1:.75}" rx="3"/>
      <text x="${x+3}" y="${y2+barH/2+3}" font-size="8" fill="white">${l.fecha_inicio.slice(5)}${l.fecha_fin?' → '+l.fecha_fin.slice(5):''}</text>
    </g>`;
  }).join('');

  return `<div style="overflow-x:auto;background:white;border-radius:var(--r);padding:8px;">
    <svg width="${W}" height="${H}" style="font-family:Segoe UI,sans-serif;">
      <line x1="${labelW}" y1="0" x2="${labelW}" y2="${H}" stroke="#dde3dd" stroke-width="1"/>
      ${bars}
    </svg></div>
  <div style="font-size:9px;color:var(--text3);margin-top:4px;padding:0 8px;">Pasa el mouse sobre cada barra para ver el detalle completo (labor, campo, huerto y fechas).</div>`;
}

async function exportCSV(seccion){
  let headers=[], rows=[];
  const y=yr();
  if(seccion==='poda'){
    headers=['Campo','Cuartel','Variedad','Há','Plantas_ha','Año','Dardos_Pl','Frutos_Dardo','Intensidad_%','Vigor','Costo_Poda_Pl','Costo_Amont_Pl','Notas'];
    CAMPOS.forEach(c=>CUARTELES.filter(q=>q.campo_id===c.id).forEach(q=>{
      PODA_DATA.filter(p=>p.cuartel_id===q.id).forEach(p=>{
        rows.push([c.nombre,q.nombre,q.variedad,q.has,q.n_plantas||1250,p.year,
          p.conteo_dardos,p.flores_dardo,p.intensidad_pct,p.vigor,p.costo_poda_pl,p.costo_amontonado_pl,p.observaciones]);
      });
    }));
  } else if(seccion==='produccion'){
    headers=['Campo','Cuartel','Variedad','Há','Año','Kg_Ha','Kg_Totales','Notas'];
    CAMPOS.forEach(c=>CUARTELES.filter(q=>q.campo_id===c.id).forEach(q=>{
      PROD_DATA.filter(p=>p.cuartel_id===q.id).forEach(p=>{
        rows.push([c.nombre,q.nombre,q.variedad,q.has,p.year,p.kg_ha,p.kg_totales,p.notas]);
      });
    }));
  } else if(seccion==='frio'){
    headers=['Campo','Año','Quincena','Horas_Frio','Richardson','Dynamic_Model_Utah'];
    FRIO_CAMPOS.forEach(f=>{
      const c=CAMPOS.find(x=>x.id===f.campo_id);
      rows.push([c?.nombre,f.year,f.quincena,f.horas_frio,f.richardson,f.dynamic_model]);
    });
  } else if(seccion==='fenologia'){
    headers=['Campo','Cuartel','Variedad','Año','Yema_Hinchada','Puntas_Verdes','Boton_Blanco','Plena_Flor','Cuaja','Cosecha_Inicio','Cosecha_Fin','Notas'];
    FEN_DATA.forEach(f=>{
      const q=CUARTELES.find(x=>x.id===f.cuartel_id);
      const c=CAMPOS.find(x=>x.id===q?.campo_id);
      rows.push([c?.nombre,q?.nombre,q?.variedad,f.year,f.f_yema_hinchada,f.f_puntas_verdes,
        f.f_boton_blanco,f.f_plena_flor,f.f_cuaja,f.f_cosecha_inicio,f.f_cosecha_fin,f.notas]);
    });
  } else if(seccion==='labores'){
    const lb=await sb('GET','labores?order=fecha_inicio.asc').catch(()=>[]);
    headers=['Campo','Cuartel','Labor','Mano_Obra','Contratista','Fecha_Inicio','Fecha_Fin','Terminada','Producto','Dosis','Unidad','Costo_Total','Notas'];
    lb.forEach(l=>{
      const c=CAMPOS.find(x=>x.id===l.campo_id);
      const q=CUARTELES.find(x=>x.id===l.cuartel_id);
      rows.push([c?.nombre,q?.nombre,l.nombre,l.mano_obra,l.contratista,l.fecha_inicio,l.fecha_fin,
        l.terminada?'SI':'NO',l.producto,l.dosis,l.unidad_dosis,l.costo_total,l.notas]);
    });
  }
  if(!rows.length){alert('Sin datos para exportar');return;}
  const v=v=>(v===null||v===undefined)?'':String(v).replace(/,/g,';').replace(/\n/g,' ');
  const csv=[headers,...rows].map(r=>r.map(v).join(',')).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`agrosuite_${seccion}.csv`;a.click();
}

  const uid=myProfile().id; if(!uid) return;
  const tipo=el('cfg-t').value;
  const update={estacion_tipo:tipo,modelo_frio:el('cfg-m').value,
    agroclima_codigo:tipo!=='davis'?el('cfg-ac').value:null,
    davis_station_id:tipo==='davis'?parseInt(el('cfg-di').value)||null:null};
  await sb('PATCH',`usuarios?id=eq.${uid}`,update);
  Object.assign(SESSION.profile,update);
  alert('✅ Guardado');
}

// ================================================================
// USUARIOS
// ================================================================
async function usuarios(){
  el('content').innerHTML='<div class="loading"><div class="spinner"></div>Cargando...</div>';
  const users=await sb('GET','usuarios?active=eq.true&order=nombre');
  el('content').innerHTML=`
  <div class="card">
    <div class="card-header"><div class="card-title">👥 Usuarios</div></div>
    ${users.map(u=>{
      const c=CHILL_ROWS.filter(x=>x.usuario_id===u.id).sort((a,b)=>new Date(b.recorded_at)-new Date(a.recorded_at))[0];
      return `<div class="stat-row">
        <div class="avatar" style="width:36px;height:36px;font-size:12px;flex-shrink:0;">${u.nombre.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}</div>
        <div style="flex:1;">
          <div style="font-size:13px;font-weight:600;">${u.nombre}</div>
          <div style="font-size:11px;color:var(--text2);">${u.rol} · ${u.email}</div>
          <div style="font-size:10px;color:var(--text3);margin-top:2px;">
            📡 ${u.estacion_tipo==='davis'?'Davis '+u.davis_station_id:'Agroclima '+u.agroclima_codigo}
            · ❄️ ${u.modelo_frio||'—'}</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:14px;font-weight:700;color:var(--frost);">${fmt(c?.acumulado,1)}</div>
          <div style="font-size:10px;color:var(--text3);">${c?.label||'Sin datos'}</div>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

// ================================================================
// MODAL
// ================================================================
function showModal(title, body, onOk){
  const ov=document.createElement('div');
  ov.className='modal-overlay';
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;';
  ov.innerHTML=`<div class="modal-box" style="background:var(--card);border-radius:var(--r2);border:1px solid var(--border);padding:20px;width:500px;max-width:100%;max-height:90vh;overflow-y:auto;">
    <div style="font-size:14px;font-weight:700;margin-bottom:14px;">${title}</div>
    ${body}
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px;">
      <button class="tbtn" onclick="this.closest('.modal-overlay').remove()">Cancelar</button>
      <button id="m-ok" class="tbtn tbtn-primary">Guardar</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  // onOk suele ser async (llama a Supabase) — hay que esperarlo antes de
  // cerrar el modal. Si no se espera, el modal se cierra de inmediato y
  // cualquier error de guardado queda como una promesa no capturada: el
  // usuario ve el modal cerrarse como si todo hubiera salido bien aunque
  // el dato nunca haya llegado a la base de datos.
  const btnOk = el('m-ok');
  const label0 = btnOk.textContent;
  btnOk.onclick = async () => {
    btnOk.disabled = true; btnOk.textContent = 'Guardando…';
    try {
      await onOk();
      ov.remove();
    } catch (e) {
      console.error(e);
      btnOk.disabled = false; btnOk.textContent = label0;
    }
  };
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
}

// ================================================================
// INIT
// ================================================================
async function init(){
  const saved=localStorage.getItem('sb_session');
  if(!saved){showLogin();return;}
  try{
    SESSION=JSON.parse(saved);
    // Verify token
    const test=await fetch(`${SB_URL}/auth/v1/user`,{
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SESSION.access_token}
    });
    if(!test.ok){localStorage.removeItem('sb_session');showLogin();return;}
    await loadProfile();
    await loadAll();
  }catch(e){console.error('init:',e);showLogin();}
}

init();
setInterval(()=>{if(SESSION)loadAll();},300000); // auto-refresh every 5min
</script>
